<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main [fixed]="true">
  <div>
    <h1 class="text-2xl font-bold tracking-tight">App Integrations</h1>
    <p class="text-muted-foreground">
      Here&apos;s a list of your apps for the integration!
    </p>
  </div>
  <div class="my-4 flex items-end justify-between sm:my-0 sm:items-center">
    <div class="flex flex-col gap-4 sm:my-4 sm:flex-row">
      <input
        hlmInput
        placeholder="Filter apps..."
        aria-label="Filter apps"
        class="h-9 w-40 lg:w-62.5"
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />
      <hlm-select [value]="appType()" (valueChange)="onTypeChange($event)">
        <hlm-select-trigger class="w-36">
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          <hlm-select-item value="all">All Apps</hlm-select-item>
          <hlm-select-item value="connected">Connected</hlm-select-item>
          <hlm-select-item value="notConnected">Not Connected</hlm-select-item>
        </hlm-select-content>
      </hlm-select>
    </div>

    <hlm-select [value]="sort()" (valueChange)="onSortChange($event)">
      <hlm-select-trigger class="w-16" aria-label="Sort apps">
        <ng-icon name="lucideSlidersHorizontal" size="18" aria-hidden="true" />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal>
        <hlm-select-item value="asc">
          <span class="flex items-center gap-4">
            <ng-icon name="lucideArrowUpAZ" size="16" aria-hidden="true" />
            <span>Ascending</span>
          </span>
        </hlm-select-item>
        <hlm-select-item value="desc">
          <span class="flex items-center gap-4">
            <ng-icon name="lucideArrowDownAZ" size="16" aria-hidden="true" />
            <span>Descending</span>
          </span>
        </hlm-select-item>
      </hlm-select-content>
    </hlm-select>
  </div>
  <div hlmSeparator class="shadow-sm"></div>
  <ul
    class="faded-bottom no-scrollbar grid gap-4 overflow-auto pt-4 pb-16 md:grid-cols-2 lg:grid-cols-3"
  >
    @for (app of filteredApps(); track app.name) {
      <li class="rounded-lg border p-4 hover:shadow-md">
        <div class="mb-8 flex items-center justify-between">
          <div
            class="bg-muted flex size-10 items-center justify-center rounded-lg p-2"
          >
            <app-brand-icon [name]="app.logo" />
          </div>
          <button
            hlmBtn
            variant="outline"
            size="sm"
            type="button"
            [class]="
              app.connected
                ? 'border border-blue-300 bg-blue-50 hover:bg-blue-100 dark:border-blue-700 dark:bg-blue-950 dark:hover:bg-blue-900'
                : ''
            "
          >
            {{ app.connected ? 'Connected' : 'Connect' }}
          </button>
        </div>
        <div>
          <h2 class="mb-1 font-semibold">{{ app.name }}</h2>
          <p class="line-clamp-2 text-gray-500">{{ app.desc }}</p>
        </div>
      </li>
    }
  </ul>
</app-main>
