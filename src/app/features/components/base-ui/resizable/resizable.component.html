<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Resizable</h2>
      <p class="text-muted-foreground">
        Draggable panels with a handle separator.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Horizontal</h3>
          <p hlmCardDescription>Two panels, drag the handle.</p>
        </div>
        <div hlmCardContent>
          <hlm-resizable-group class="max-w-md rounded-lg border">
            <hlm-resizable-panel defaultSize="50">
              <div class="flex h-[200px] items-center justify-center p-6">
                <span class="font-semibold">One</span>
              </div>
            </hlm-resizable-panel>
            <hlm-resizable-handle withHandle />
            <hlm-resizable-panel defaultSize="50">
              <div class="flex h-[200px] items-center justify-center p-6">
                <span class="font-semibold">Two</span>
              </div>
            </hlm-resizable-panel>
          </hlm-resizable-group>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Vertical</h3>
          <p hlmCardDescription>Header over content.</p>
        </div>
        <div hlmCardContent>
          <hlm-resizable-group class="min-h-[200px] max-w-md rounded-lg border" direction="vertical">
            <hlm-resizable-panel defaultSize="25">
              <div class="flex h-full items-center justify-center p-6">
                <span class="font-semibold">Header</span>
              </div>
            </hlm-resizable-panel>
            <hlm-resizable-handle withHandle />
            <hlm-resizable-panel defaultSize="75">
              <div class="flex h-full items-center justify-center p-6">
                <span class="font-semibold">Content</span>
              </div>
            </hlm-resizable-panel>
          </hlm-resizable-group>
        </div>
      </section>
    </div>
  </div>
</app-main>
