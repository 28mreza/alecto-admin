<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Label</h2>
      <p class="text-muted-foreground">
        An accessible label for form controls.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>With Checkbox</h3>
          <p hlmCardDescription>Terms acceptance.</p>
        </div>
        <div hlmCardContent>
          <div class="flex gap-2">
            <hlm-checkbox inputId="label-terms" />
            <label hlmLabel for="label-terms">Accept terms and conditions</label>
          </div>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>With Input</h3>
          <p hlmCardDescription>Labelled username field.</p>
        </div>
        <div hlmCardContent class="grid gap-2">
          <label hlmLabel for="label-username">Username</label>
          <input hlmInput id="label-username" placeholder="mrezadev" />
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Disabled</h3>
          <p hlmCardDescription>Dimmed label for a disabled control.</p>
        </div>
        <div hlmCardContent class="grid gap-2">
          <label hlmLabel for="label-disabled" class="peer-disabled:opacity-50">Notifications (disabled)</label>
          <input hlmInput id="label-disabled" placeholder="Disabled input" disabled class="peer" />
        </div>
      </section>
    </div>
  </div>
</app-main>
