<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Chart</h2>
      <p class="text-muted-foreground">
        Bar charts with tooltips and responsive ticks.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Bar</h3>
          <p hlmCardDescription>Monthly revenue, vertical bars.</p>
        </div>
        <div hlmCardContent>
          <tanstack-chart hlmChart [options]="barOptions" class="h-72" />
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Horizontal</h3>
          <p hlmCardDescription>Same data, horizontal bars.</p>
        </div>
        <div hlmCardContent>
          <tanstack-chart hlmChart [options]="horizontalOptions" class="h-72" />
        </div>
      </section>
    </div>
  </div>
</app-main>
