<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Radio Group</h2>
      <p class="text-muted-foreground">
        A set of checkable buttons where only one can be selected.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Basic</h3>
          <p hlmCardDescription>Spacing picker with labels.</p>
        </div>
        <div hlmCardContent>
          <hlm-radio-group [(ngModel)]="spacing">
            <div class="flex items-center gap-3">
              <hlm-radio value="default" inputId="rg-default">
                <hlm-radio-indicator indicator />
              </hlm-radio>
              <label hlmLabel for="rg-default">Default</label>
            </div>
            <div class="flex items-center gap-3">
              <hlm-radio value="comfortable" inputId="rg-comfortable">
                <hlm-radio-indicator indicator />
              </hlm-radio>
              <label hlmLabel for="rg-comfortable">Comfortable</label>
            </div>
            <div class="flex items-center gap-3">
              <hlm-radio value="compact" inputId="rg-compact">
                <hlm-radio-indicator indicator />
              </hlm-radio>
              <label hlmLabel for="rg-compact">Compact</label>
            </div>
          </hlm-radio-group>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Disabled</h3>
          <p hlmCardDescription>One option unavailable.</p>
        </div>
        <div hlmCardContent>
          <hlm-radio-group value="standard">
            <div class="flex items-center gap-3">
              <hlm-radio value="standard" inputId="rg-standard">
                <hlm-radio-indicator indicator />
              </hlm-radio>
              <label hlmLabel for="rg-standard">Standard shipping</label>
            </div>
            <div class="flex items-center gap-3">
              <hlm-radio value="express" inputId="rg-express" disabled>
                <hlm-radio-indicator indicator />
              </hlm-radio>
              <label hlmLabel for="rg-express">Express (unavailable)</label>
            </div>
          </hlm-radio-group>
          <p class="text-muted-foreground mt-4 text-sm">Express delivery is paused in your region.</p>
        </div>
      </section>
    </div>
  </div>
</app-main>
