<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Input Group</h2>
      <p class="text-muted-foreground">
        Joins addons, inputs, and buttons into one control.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Prefix</h3>
          <p hlmCardDescription>Static text before the input.</p>
        </div>
        <div hlmCardContent>
          <div hlmInputGroup>
            <div hlmInputGroupAddon>
              <span hlmInputGroupText>https://</span>
            </div>
            <input hlmInputGroupInput placeholder="Website URL" aria-label="Website URL" />
          </div>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Icon Addon</h3>
          <p hlmCardDescription>Search icon inside the input.</p>
        </div>
        <div hlmCardContent>
          <div hlmInputGroup>
            <div hlmInputGroupAddon>
              <ng-icon name="lucideSearch" />
            </div>
            <input hlmInputGroupInput placeholder="Search docs..." aria-label="Search docs" />
          </div>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Suffix Button</h3>
          <p hlmCardDescription>Action button joined to the input.</p>
        </div>
        <div hlmCardContent>
          <div hlmInputGroup>
            <input hlmInputGroupInput placeholder="Email address" aria-label="Email address" />
            <button hlmInputGroupButton type="button">Subscribe</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</app-main>
