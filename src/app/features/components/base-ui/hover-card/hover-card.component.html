<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Hover Card</h2>
      <p class="text-muted-foreground">
        A preview card shown when hovering a trigger.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Basic</h3>
          <p hlmCardDescription>Hover the link to preview.</p>
        </div>
        <div hlmCardContent>
          <hlm-hover-card>
            <button hlmBtn variant="link" hlmHoverCardTrigger type="button">
              &#64;alecto
            </button>
            <hlm-hover-card-content *hlmHoverCardPortal class="w-80">
              <p class="text-sm">
                Alecto Admin — an Angular admin template built with Spartan UI.
              </p>
            </hlm-hover-card-content>
          </hlm-hover-card>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Profile</h3>
          <p hlmCardDescription>User card with avatar and bio.</p>
        </div>
        <div hlmCardContent>
          <hlm-hover-card>
            <button hlmBtn variant="link" hlmHoverCardTrigger type="button">
              &#64;mrezadev
            </button>
            <hlm-hover-card-content *hlmHoverCardPortal class="w-80">
              <div class="flex gap-4">
                <hlm-avatar>
                  <img hlmAvatarImage src="/avatars/shadcn.jpg" alt="Muhamad Reza" />
                  <span hlmAvatarFallback>MR</span>
                </hlm-avatar>
                <div class="grid gap-1">
                  <p class="text-sm font-semibold">Muhamad Reza</p>
                  <p class="text-muted-foreground text-sm">
                    Frontend engineer. Building admin tools with Angular.
                  </p>
                  <p class="text-muted-foreground text-xs">Joined December 2024</p>
                </div>
              </div>
            </hlm-hover-card-content>
          </hlm-hover-card>
        </div>
      </section>
    </div>
  </div>
</app-main>
