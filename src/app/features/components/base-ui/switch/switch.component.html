<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Switch</h2>
      <p class="text-muted-foreground">
        An on/off toggle control.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>With Label</h3>
          <p hlmCardDescription>Airplane mode setting.</p>
        </div>
        <div hlmCardContent>
          <div class="flex items-center gap-3">
            <hlm-switch inputId="switch-airplane" />
            <label hlmLabel for="switch-airplane">Airplane mode</label>
          </div>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>States</h3>
          <p hlmCardDescription>Checked and disabled.</p>
        </div>
        <div hlmCardContent class="grid gap-4">
          <div class="flex items-center gap-3">
            <hlm-switch inputId="switch-notifications" checked />
            <label hlmLabel for="switch-notifications">Notifications</label>
          </div>
          <div class="flex items-center gap-3">
            <hlm-switch inputId="switch-disabled" disabled />
            <label hlmLabel for="switch-disabled">Disabled option</label>
          </div>
        </div>
      </section>
    </div>
  </div>
</app-main>
