<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Checkbox</h2>
      <p class="text-muted-foreground">
        A control that allows the user to toggle between checked and unchecked.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Basic</h3>
          <p hlmCardDescription>Checkboxes bound to signals.</p>
        </div>
        <div hlmCardContent class="grid gap-4">
          <div class="flex items-center gap-2">
            <hlm-checkbox inputId="terms" [(checked)]="terms" />
            <label for="terms" class="text-sm font-medium">
              Accept terms and conditions
            </label>
          </div>
          <div class="flex items-center gap-2">
            <hlm-checkbox inputId="newsletter" [(checked)]="newsletter" />
            <label for="newsletter" class="text-sm font-medium">
              Subscribe to newsletter
            </label>
          </div>
          <p class="text-muted-foreground text-sm">
            Terms: {{ terms() ? 'accepted' : 'pending' }} · Newsletter:
            {{ newsletter() ? 'on' : 'off' }}
          </p>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Disabled</h3>
          <p hlmCardDescription>Checked and unchecked disabled states.</p>
        </div>
        <div hlmCardContent class="grid gap-4">
          <div class="flex items-center gap-2">
            <hlm-checkbox inputId="archived-on" checked disabled />
            <label for="archived-on" class="text-sm font-medium">
              Archived project
            </label>
          </div>
          <div class="flex items-center gap-2">
            <hlm-checkbox inputId="archived-off" disabled />
            <label for="archived-off" class="text-sm font-medium">
              Deleted project
            </label>
          </div>
        </div>
      </section>
    </div>
  </div>
</app-main>
