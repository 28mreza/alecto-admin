<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Progress</h2>
      <p class="text-muted-foreground">
        An indicator showing completion progress of a task.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Values</h3>
          <p hlmCardDescription>Fixed completion states.</p>
        </div>
        <div hlmCardContent class="grid gap-6">
          <hlm-progress class="w-full" [value]="33" aria-label="33 percent progress">
            <hlm-progress-indicator />
          </hlm-progress>
          <hlm-progress class="w-full" [value]="65" aria-label="65 percent progress">
            <hlm-progress-indicator />
          </hlm-progress>
          <hlm-progress class="w-full" [value]="100" aria-label="Complete progress">
            <hlm-progress-indicator />
          </hlm-progress>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Indeterminate</h3>
          <p hlmCardDescription>Unknown completion.</p>
        </div>
        <div hlmCardContent>
          <hlm-progress class="w-full" aria-label="Loading progress">
            <hlm-progress-indicator />
          </hlm-progress>
        </div>
      </section>
    </div>
  </div>
</app-main>
