<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Textarea</h2>
      <p class="text-muted-foreground">
        A multi-line text input.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>With Label</h3>
          <p hlmCardDescription>Bio field with helper text.</p>
        </div>
        <div hlmCardContent class="grid gap-2">
          <label hlmLabel for="textarea-bio">Bio</label>
          <textarea hlmTextarea id="textarea-bio" placeholder="Tell us about yourself"></textarea>
          <p class="text-muted-foreground text-sm">Visible on your public profile.</p>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Disabled</h3>
          <p hlmCardDescription>Non-interactive state.</p>
        </div>
        <div hlmCardContent class="grid gap-2">
          <label hlmLabel for="textarea-disabled">Notes (disabled)</label>
          <textarea hlmTextarea id="textarea-disabled" placeholder="Disabled textarea" disabled></textarea>
        </div>
      </section>
    </div>
  </div>
</app-main>
