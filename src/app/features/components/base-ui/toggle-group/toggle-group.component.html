<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Toggle Group</h2>
      <p class="text-muted-foreground">
        A set of related two-state buttons.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Multiple</h3>
          <p hlmCardDescription>Formatting toggles, several on.</p>
        </div>
        <div hlmCardContent>
          <hlm-toggle-group type="multiple" variant="outline">
            <button hlmToggleGroupItem value="bold" type="button" aria-label="Toggle bold">
              <ng-icon name="lucideBold" />
            </button>
            <button hlmToggleGroupItem value="italic" type="button" aria-label="Toggle italic">
              <ng-icon name="lucideItalic" />
            </button>
            <button hlmToggleGroupItem value="underline" type="button" aria-label="Toggle underline">
              <ng-icon name="lucideUnderline" />
            </button>
          </hlm-toggle-group>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Single Outline</h3>
          <p hlmCardDescription>One selection at a time.</p>
        </div>
        <div hlmCardContent>
          <hlm-toggle-group type="single" variant="outline" value="all">
            <button hlmToggleGroupItem value="all" type="button" aria-label="Toggle all">All</button>
            <button hlmToggleGroupItem value="missed" type="button" aria-label="Toggle missed">Missed</button>
          </hlm-toggle-group>
        </div>
      </section>
    </div>
  </div>
</app-main>
