<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Dialog</h2>
      <p class="text-muted-foreground">
        A window overlaid on the primary content.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Edit Profile</h3>
          <p hlmCardDescription>Form dialog with a save footer.</p>
        </div>
        <div hlmCardContent>
          <hlm-dialog>
            <button hlmDialogTrigger hlmBtn variant="outline" type="button">
              Edit profile
            </button>
            <hlm-dialog-content *hlmDialogPortal="let ctx">
              <div hlmDialogHeader>
                <h2 hlmDialogTitle>Edit profile</h2>
                <p hlmDialogDescription>
                  Make changes to your profile here. Click save when done.
                </p>
              </div>
              <div class="grid gap-4 py-4">
                <div class="grid gap-2">
                  <label hlmLabel for="dialog-name">Name</label>
                  <input hlmInput id="dialog-name" value="Muhamad Reza" />
                </div>
                <div class="grid gap-2">
                  <label hlmLabel for="dialog-username">Username</label>
                  <input hlmInput id="dialog-username" value="mrezadev" />
                </div>
              </div>
              <div hlmDialogFooter>
                <button hlmDialogClose hlmBtn variant="outline" type="button">
                  Cancel
                </button>
                <button hlmBtn type="button">Save changes</button>
              </div>
            </hlm-dialog-content>
          </hlm-dialog>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Share Link</h3>
          <p hlmCardDescription>Readonly link with a copy button.</p>
        </div>
        <div hlmCardContent>
          <hlm-dialog>
            <button hlmDialogTrigger hlmBtn variant="outline" type="button">
              Share
            </button>
            <hlm-dialog-content *hlmDialogPortal="let ctx">
              <div hlmDialogHeader>
                <h2 hlmDialogTitle>Share this workspace</h2>
                <p hlmDialogDescription>
                  Anyone with the link can view this workspace.
                </p>
              </div>
              <div class="flex items-center gap-2 py-4">
                <input
                  hlmInput
                  readonly
                  value="https://alecto.dev/w/abc123"
                  aria-label="Share link"
                  class="flex-1"
                />
                <button hlmBtn type="button">Copy</button>
              </div>
              <div hlmDialogFooter>
                <button hlmDialogClose hlmBtn variant="outline" type="button">
                  Close
                </button>
              </div>
            </hlm-dialog-content>
          </hlm-dialog>
        </div>
      </section>
    </div>
  </div>
</app-main>
