<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Badge</h2>
      <p class="text-muted-foreground">
        Displays a small status descriptor for UI elements.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Variants</h3>
          <p hlmCardDescription>All six badge variants.</p>
        </div>
        <div hlmCardContent class="flex flex-wrap items-center gap-2">
          <span hlmBadge>Default</span>
          <span hlmBadge variant="secondary">Secondary</span>
          <span hlmBadge variant="destructive">Destructive</span>
          <span hlmBadge variant="outline">Outline</span>
          <span hlmBadge variant="ghost">Ghost</span>
          <span hlmBadge variant="link">Link</span>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>With Icon</h3>
          <p hlmCardDescription>Badges with a leading icon.</p>
        </div>
        <div hlmCardContent class="flex flex-wrap items-center gap-2">
          <span hlmBadge variant="secondary">
            <ng-icon name="lucideBadgeCheck" />
            Verified
          </span>
          <span hlmBadge variant="outline">
            <ng-icon name="lucideSparkles" />
            New
          </span>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Status</h3>
          <p hlmCardDescription>Badges as workflow status labels.</p>
        </div>
        <div hlmCardContent class="flex flex-wrap items-center gap-2">
          <span hlmBadge variant="secondary">Draft</span>
          <span hlmBadge variant="outline">In Review</span>
          <span hlmBadge>Published</span>
        </div>
      </section>
    </div>
  </div>
</app-main>
