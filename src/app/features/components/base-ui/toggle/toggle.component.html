<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Toggle</h2>
      <p class="text-muted-foreground">
        A two-state button.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Basic</h3>
          <p hlmCardDescription>Bookmark and italic with text.</p>
        </div>
        <div hlmCardContent class="flex flex-wrap items-center gap-4">
          <button hlmToggle size="sm" variant="outline" type="button" aria-label="Toggle bookmark">
            <ng-icon name="lucideBookmark" />
            Bookmark
          </button>
          <button hlmToggle type="button" aria-label="Toggle italic">
            <ng-icon name="lucideItalic" />
            Italic
          </button>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Outline</h3>
          <p hlmCardDescription>Outlined bold and italic.</p>
        </div>
        <div hlmCardContent class="flex flex-wrap items-center gap-4">
          <button hlmToggle variant="outline" type="button" aria-label="Toggle bold">
            <ng-icon name="lucideBold" />
            Bold
          </button>
          <button hlmToggle variant="outline" type="button" aria-label="Toggle italic">
            <ng-icon name="lucideItalic" />
            Italic
          </button>
        </div>
      </section>
    </div>
  </div>
</app-main>
