<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Input OTP</h2>
      <p class="text-muted-foreground">
        One-time password entry with grouped slots.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Six Digit</h3>
          <p hlmCardDescription>Grouped 2-2-2 with separators.</p>
        </div>
        <div hlmCardContent>
          <brn-input-otp
            hlmInputOtp
            [length]="6"
            aria-label="Six digit code"
            class="justify-between"
          >
            <hlm-input-otp-group>
              <hlm-input-otp-slot [index]="0" />
              <hlm-input-otp-slot [index]="1" />
            </hlm-input-otp-group>
            <hlm-input-otp-separator />
            <hlm-input-otp-group>
              <hlm-input-otp-slot [index]="2" />
              <hlm-input-otp-slot [index]="3" />
            </hlm-input-otp-group>
            <hlm-input-otp-separator />
            <hlm-input-otp-group>
              <hlm-input-otp-slot [index]="4" />
              <hlm-input-otp-slot [index]="5" />
            </hlm-input-otp-group>
          </brn-input-otp>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Four Digit PIN</h3>
          <p hlmCardDescription>Grouped 2-2 for short codes.</p>
        </div>
        <div hlmCardContent>
          <brn-input-otp
            hlmInputOtp
            [length]="4"
            aria-label="Four digit PIN"
            class="justify-between"
          >
            <hlm-input-otp-group>
              <hlm-input-otp-slot [index]="0" />
              <hlm-input-otp-slot [index]="1" />
            </hlm-input-otp-group>
            <hlm-input-otp-separator />
            <hlm-input-otp-group>
              <hlm-input-otp-slot [index]="2" />
              <hlm-input-otp-slot [index]="3" />
            </hlm-input-otp-group>
          </brn-input-otp>
        </div>
      </section>
    </div>
  </div>
</app-main>
