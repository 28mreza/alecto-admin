<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Button Group</h2>
      <p class="text-muted-foreground">
        Groups related buttons and inputs into a single control.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Horizontal</h3>
          <p hlmCardDescription>Joined outline buttons.</p>
        </div>
        <div hlmCardContent>
          <div hlmButtonGroup>
            <button hlmBtn variant="outline" type="button">Left</button>
            <button hlmBtn variant="outline" type="button">Center</button>
            <button hlmBtn variant="outline" type="button">Right</button>
          </div>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Split Button</h3>
          <p hlmCardDescription>An action with a separated icon button.</p>
        </div>
        <div hlmCardContent>
          <div hlmButtonGroup>
            <button hlmBtn variant="secondary" type="button">
              <ng-icon name="lucideCheck" />
              Approve
            </button>
            <hlm-button-group-separator />
            <button hlmBtn variant="secondary" size="icon" type="button" aria-label="More approve options">
              <ng-icon name="lucidePlus" />
            </button>
          </div>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Vertical</h3>
          <p hlmCardDescription>Stacked icon buttons.</p>
        </div>
        <div hlmCardContent>
          <div hlmButtonGroup orientation="vertical">
            <button hlmBtn variant="outline" size="icon" type="button" aria-label="Add">
              <ng-icon name="lucidePlus" />
            </button>
            <button hlmBtn variant="outline" size="icon" type="button" aria-label="Confirm">
              <ng-icon name="lucideCheck" />
            </button>
            <button hlmBtn variant="outline" size="icon" type="button" aria-label="Remove">
              <ng-icon name="lucideX" />
            </button>
          </div>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>With Input</h3>
          <p hlmCardDescription>A prefix label and input joined with a button.</p>
        </div>
        <div hlmCardContent>
          <div hlmButtonGroup>
            <span hlmButtonGroupText>https://</span>
            <input hlmInput placeholder="Website URL" aria-label="Website URL" />
            <button hlmBtn variant="outline" type="button">Visit</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</app-main>
