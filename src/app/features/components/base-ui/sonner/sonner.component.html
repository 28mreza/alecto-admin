<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Sonner (Toast)</h2>
      <p class="text-muted-foreground">
        Toast notifications in the global toaster. Click to fire.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Types</h3>
          <p hlmCardDescription>Default, success, and error toasts.</p>
        </div>
        <div hlmCardContent class="flex flex-wrap gap-4">
          <button hlmBtn variant="outline" type="button" (click)="showDefault()">Default</button>
          <button hlmBtn variant="outline" type="button" (click)="showSuccess()">Success</button>
          <button hlmBtn variant="outline" type="button" (click)="showError()">Error</button>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Info &amp; Description</h3>
          <p hlmCardDescription>Info toast and one with a description.</p>
        </div>
        <div hlmCardContent class="flex flex-wrap gap-4">
          <button hlmBtn variant="outline" type="button" (click)="showInfo()">Info</button>
          <button hlmBtn variant="outline" type="button" (click)="showWithDescription()">With Description</button>
        </div>
      </section>
    </div>
  </div>
</app-main>
