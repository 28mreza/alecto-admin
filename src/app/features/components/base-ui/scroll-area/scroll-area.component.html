<app-header [fixed]="true">
  <app-search className="me-auto" />
  <app-refresh-button />
  <app-theme-switch />
  <app-config-drawer />
  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Scroll Area</h2>
      <p class="text-muted-foreground">
        A styled scrollable viewport.
      </p>
    </div>

    <div class="grid items-start gap-4 lg:grid-cols-2">
      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Vertical</h3>
          <p hlmCardDescription>Tag list with separators.</p>
        </div>
        <div hlmCardContent>
          <ng-scrollbar hlm class="h-72 w-full border" appearance="compact">
            <div class="p-4" scrollViewport>
              <h4 class="mb-4 text-sm leading-none font-medium">Tags</h4>
              @for (tag of tags; track tag) {
                <div class="text-sm">
                  {{ tag }}
                  <div hlmSeparator class="my-2"></div>
                </div>
              }
            </div>
          </ng-scrollbar>
        </div>
      </section>

      <section hlmCard>
        <div hlmCardHeader>
          <h3 hlmCardTitle>Horizontal</h3>
          <p hlmCardDescription>Numbered boxes, scroll sideways.</p>
        </div>
        <div hlmCardContent>
          <ng-scrollbar hlm class="w-full border whitespace-nowrap">
            <div class="flex w-max gap-3 p-4">
              @for (box of boxes; track box) {
                <div class="bg-muted flex size-20 shrink-0 items-center justify-center rounded-md text-lg font-semibold">
                  {{ box }}
                </div>
              }
            </div>
          </ng-scrollbar>
        </div>
      </section>
    </div>
  </div>
</app-main>
