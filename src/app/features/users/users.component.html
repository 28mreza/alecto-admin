<app-header [fixed]="true">

  <app-refresh-button />
  <app-theme-switch />

  <app-profile-dropdown />
</app-header>

<app-main>
  <div class="flex flex-1 flex-col gap-4 sm:gap-6">
    <div class="flex flex-wrap items-end justify-between gap-2">
